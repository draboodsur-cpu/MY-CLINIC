<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123B4A">
<title>عيادتي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EFF3F4;--surface:#fff;--ink:#16262D;--muted:#5D6D73;--line:#D5DEE1;--field:#F5F8F9;--pri:#123B4A;--on-pri:#fff;--acc:#1C7C8C;--acc-soft:#DDEFF1;--ok:#1E7A4D;--ok-soft:#DFF1E7;--warn:#A86400;--warn-soft:#FBEBD3;--bad:#B3261E;--bad-soft:#F8DEDC;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E171B;--surface:#162229;--ink:#E3EBEE;--muted:#93A3A9;--line:#283A42;--field:#1A2830;--pri:#7FC4D2;--on-pri:#08262C;--acc:#5CC0CF;--acc-soft:#173840;--ok:#5BC48A;--ok-soft:#173326;--warn:#E8A94A;--warn-soft:#3A2C14;--bad:#F08B83;--bad-soft:#3E1F1D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
header.top h1{font-size:1.25rem;font-weight:700;margin:0;flex:1}
.back{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:1.2rem}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:180px;border:0;background:none;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--pri);background:var(--acc-soft)}
.fab{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:11;border:0;border-radius:18px;background:var(--pri);color:var(--on-pri);padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.chips button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.strip b{display:block;font-size:1.35rem;line-height:1.2}
.strip span{font-size:.78rem;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.banner b{color:var(--warn)}
.banner .btn{flex:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:right}
.item:first-child{border-top:0}
.item:active{background:var(--acc-soft)}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--acc-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700}
.item .m{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .e{flex:none;font-size:.78rem;color:var(--muted);text-align:left}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--pri);margin-inline-start:4px;vertical-align:1px}
.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.b{background:var(--bad-soft);color:var(--bad)}.tag.g{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
h2{font-size:1rem;margin:22px 2px 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.phead{display:flex;gap:14px;align-items:center}
.phead .av{width:56px;height:56px;font-size:1.3rem}
.phead h1{margin:0;font-size:1.3rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:12px;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.d{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:10px}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-inline-start:4px solid var(--acc)}
.visit.first{border-inline-start-color:var(--pri)}
.visit .vh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.visit .vh b{font-size:.95rem}
.visit .vh span{font-size:.8rem;color:var(--muted)}
.fld{margin-top:8px}
.fld small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.fld div{white-space:pre-wrap}
.inv{margin-top:8px;background:var(--field);border-radius:10px;padding:8px 10px;font-size:.9rem}
.inv .ih{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.inv .ih span{font-weight:400;font-size:.78rem;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:.75rem;line-height:22px;padding:0}
.op{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.op.urgent{border-inline-start:4px solid var(--bad)}
.op .oh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.op .on{font-weight:700}
.op .od{font-size:.85rem;color:var(--muted)}
.op .oa{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chk{font-size:.8rem;color:var(--muted);margin-top:6px}
.chk i{font-style:normal;margin-inline-end:8px}
.chk i.y{color:var(--ok)}
.dhead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.dhead b{font-size:.95rem}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--muted);font-weight:600;font-size:.85rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:20px 20px 0 0;max-height:94vh;overflow:auto;padding:0 0 26px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-h{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-size:1.08rem;flex:1}
.sh-b{padding:14px 16px}
.x{border:0;background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:10px}
fieldset{border:0;margin:0 0 14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
legend{font-weight:700;font-size:.9rem;padding:0 4px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px;font-weight:600}
label.f input,label.f select,label.f textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem}
label.f textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cb{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.92rem}
.cb input{width:20px;height:20px;accent-color:var(--acc)}
.dup{background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.dup b{color:var(--warn)}
.dup .di{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08)}
.dup .di:first-of-type{border-top:0}
.infb{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.infb .row1{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.infb .row1 select{flex:1}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin:4px 0 8px}
.foot{display:flex;gap:8px;padding:0 16px}
.foot .btn{flex:1;justify-content:center;padding:12px}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;font-size:.9rem}
.toast.show{opacity:1}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:none;align-items:center;justify-content:center}
.viewer.open{display:flex}.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:14px;left:14px;border:0;background:rgba(255,255,255,.2);color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.2rem}
.lock{position:fixed;inset:0;z-index:80;background:var(--pri);color:var(--on-pri);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.lock.open{display:flex}
.lock h2{margin:0;font-size:1.2rem}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor}.dots i.f{background:currentColor}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:inherit;font-size:1.5rem;font-weight:600}
@media (prefers-color-scheme:dark){.pad button{background:rgba(0,0,0,.15)}}
.lock .lerr{min-height:1.3em;font-size:.9rem}
.lock .forgot{background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;font-size:.88rem}
.set .item{cursor:pointer}
.hl{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hl:first-child{border-top:0}.hl span{flex:1}
.note{font-size:.85rem;color:var(--muted)}
@media print{nav.tabs,.fab,.acts,.noprint,header.top .back{display:none!important}body{background:#fff}.wrap{padding:0}.visit,.card,.op{break-inside:avoid;border-color:#bbb}}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<button class="fab" id="fab">+ مريض / مراجعة</button>
<nav class="tabs">
  <button data-go="#patients"><span class="i">👥</span>المرضى</button>
  <button data-go="#ops"><span class="i">🩺</span>العمليات</button>
  <button data-go="#settings"><span class="i">⚙️</span>النسخ والإعدادات</button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="viewer" id="viewer"><button aria-label="إغلاق">✕</button><img alt=""></div>
<div class="lock" id="lock"><h2 id="lockT">أدخل رمز الدخول</h2><div class="dots" id="dots"></div><div class="lerr" id="lerr"></div><div class="pad" id="pad"></div><button class="forgot" id="forgot">نسيت الرمز؟</button></div>
<div class="toast" id="toast"></div>
<script>
/* ================= storage ================= */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('clinic-db',1);r.onupgradeneeded=()=>{const d=r.result;['patients','visits','surgeries','files'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(s,mode,fn){return new Promise((res,rej)=>{const tx=DB.db.transaction(s,mode);const q=fn(tx.objectStore(s));let out;if(q)q.onsuccess=()=>{out=q.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})},
  all(s){return DB.req(s,'readonly',o=>o.getAll())},
  get(s,k){return DB.req(s,'readonly',o=>o.get(k))},
  put(s,v){return DB.req(s,'readwrite',o=>o.put(v))},
  del(s,k){if(!SYNC.applying&&SYNC.stores.includes(s)){(SET.tomb=SET.tomb||[]).push({store:s,id:k})}return DB.req(s,'readwrite',o=>o.delete(k))},
  clear(s){return DB.req(s,'readwrite',o=>o.clear())}
};
let PAT=new Map(),VIS=[],OPS=[],SET={};
const DEF_SET={hospitals:['مجمع ناصر الطبي'],nextNo:1,pinHash:null,pinSalt:null,backupPass:null,lastBackup:null,changes:0,lockMins:5};
async function loadAll(){
  const [p,v,o,m]=await Promise.all([DB.all('patients'),DB.all('visits'),DB.all('surgeries'),DB.get('meta','settings')]);
  PAT=new Map(p.map(x=>[x.id,x]));VIS=v;OPS=o;SET=Object.assign({},DEF_SET,m?m.value:{});
}
async function saveSet(){await DB.put('meta',{key:'settings',value:SET})}
async function bump(){SET.changes=(SET.changes||0)+1;await saveSet();syncSoon()}
async function savePatient(p){p.updated=Date.now();PAT.set(p.id,p);await DB.put('patients',p);await bump()}
async function saveVisit(v){v.updated=Date.now();const i=VIS.findIndex(x=>x.id===v.id);if(i>=0)VIS[i]=v;else VIS.push(v);await DB.put('visits',v);await bump()}
async function saveOp(o){o.updated=Date.now();const i=OPS.findIndex(x=>x.id===o.id);if(i>=0)OPS[i]=o;else OPS.push(o);await DB.put('surgeries',o);await bump()}

/* ================= sync (Google Sheet + Calendar) ================= */
const SYNC={stores:['patients','visits','surgeries'],applying:false,busy:false,t:null,err:''};
function syncSoon(ms){if(!SET.syncUrl)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(syncNow,ms??3000)}
async function syncNow(manual){
  if(!SET.syncUrl||SYNC.busy)return;if(!navigator.onLine){SYNC.err='ما في نت';return}
  SYNC.busy=true;SYNC.err='';
  try{
    const start=Date.now(),since=SET.lastSync||0,pushedAt=SET.pushedAt||0;
    const ts=x=>+(x.updated||x.created||0);
    const changes={patients:[...PAT.values()].filter(x=>ts(x)>pushedAt),visits:VIS.filter(x=>ts(x)>pushedAt),surgeries:OPS.filter(x=>ts(x)>pushedAt),deleted:(SET.tomb||[]).slice()};
    const sent=changes.deleted.length;
    const r=await fetch(SET.syncUrl,{method:'POST',body:JSON.stringify({action:'sync',since,changes})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'خطأ');
    SYNC.applying=true;let n=0;
    try{
      for(const s of SYNC.stores)for(const rec of j[s]||[]){const cur=await DB.get(s,rec.id);if(cur&&ts(cur)>=ts(rec))continue;await DB.put(s,rec);n++}
      for(const d of j.deleted||[]){if(!SYNC.stores.includes(d.store))continue;const cur=await DB.get(d.store,d.id);if(!cur)continue;
        if(d.store==='visits')await delVisitFiles(cur);
        await DB.del(d.store,d.id);n++}
    }finally{SYNC.applying=false}
    SET.tomb=(SET.tomb||[]).slice(sent);SET.lastSync=j.now;SET.pushedAt=start;SET.syncedAt=Date.now();
    const keep=SET;await loadAll();SET=keep;for(const p of PAT.values())if(+p.no>=(SET.nextNo||1))SET.nextNo=+p.no+1;await saveSet();
    if(n&&!scrim.classList.contains('open'))route();
    if(manual)toast('تمت المزامنة ✓');
  }catch(e){SYNC.err=String(e&&e.message||e);if(manual)toast('ما زبطت المزامنة: '+SYNC.err)}
  finally{SYNC.busy=false;if(location.hash==='#settings'&&manual!==false&&!scrim.classList.contains('open'))route()}
}
async function syncSetup(){
  const u=(prompt('الصق رابط المزامنة (من Apps Script):',SET.syncUrl||'')||'').trim();if(!u)return;
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+[?&]k=/.test(u)){toast('الرابط مش صحيح');return}
  if(/\/dev(\?|$)/.test(u)){toast('هاد رابط /dev — بدنا رابط /exec من Manage deployments');return}
  try{const r=await fetch(u);const j=await r.json();if(!j.ok||j.app!=='clinic-sync')throw 0}catch(e){toast('ما قدرت أتصل بالرابط');return}
  SET.syncUrl=u;SET.lastSync=0;SET.pushedAt=0;SET.tomb=[];await saveSet();await syncNow(true);
}
async function syncOff(){SET.syncUrl=null;await saveSet();toast('انطفت المزامنة');route()}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function fd(s){if(!s)return '';const [y,m,d]=s.split('-');return `${+d}/${+m}/${y}`}
function rel(s){if(!s)return '';const t=today();if(s===t)return 'اليوم';if(s===addDays(t,1))return 'غداً';if(s===addDays(t,-1))return 'أمس';return DAYS[new Date(s+'T00:00').getDay()]+' '+fd(s)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
function norm(s){return String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim()}
const digits=s=>String(s||'').replace(/\D/g,'');
function phoneKey(s){let d=digits(s);if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('970')||d.startsWith('972'))d=d.slice(3);if(d.startsWith('0'))d=d.slice(1);return d}
function waLink(s){const k=phoneKey(s);return k.length>=8?'https://wa.me/970'+k:null}
function ageNow(p){if(p.age==null||p.age==='')return '';const months=(p.ageUnit==='m'?+p.age:+p.age*12)+Math.max(0,Math.floor((Date.now()-new Date((p.ageAt||today())+'T00:00'))/(30.44*864e5)));return months<24?`${Math.round(months)} شهر`:`${Math.floor(months/12)} سنة`}
const initials=n=>{const w=String(n||'?').trim().split(/\s+/);return (w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')};

function backupBanner(){
  const days=SET.lastBackup?Math.floor((Date.now()-SET.lastBackup)/864e5):null;
  if(!PAT.size||!SET.changes)return '';
  if(days!==null&&days<7&&SET.changes<30)return '';
  return `<div class="banner"><div style="flex:1">${days===null?'<b>ما في نسخة احتياطية بعد.</b> ':`<b>آخر نسخة قبل ${days} يوم.</b> `}أرسل نسخة لإيميلك عشان ما تضيع البيانات.</div><button class="btn sm p" onclick="backupNow()">إرسال</button></div>`;
}
function viewPatients(){

function drawList(){
  const q=norm($('#q').value),qd=digits($('#q').value),t=today();

  let arr=[...PAT.values()].map(p=>({p,lv:lastVisit(p.id)}));
  if(listFilter==='today')arr=arr.filter(x=>VIS.some(v=>v.patientId===x.p.id&&v.date===t));
  if(listFilter==='ops')arr=arr.filter(x=>openOps.has(x.p.id));
  if(q)arr=arr.filter(({p})=>{if(norm(p.name).includes(q))return true;if(qd.length>=3&&(digits(p.phone).includes(qd)||digits(p.nid).includes(qd)||String(p.no)===qd))return true;return VIS.some(v=>v.patientId===p.id&&norm(v.diagnosis).includes(q))});
  arr.sort((a,b)=>((b.lv&&b.lv.date)||'').localeCompare((a.lv&&a.lv.date)||'')||(b.p.updated||0)-(a.p.updated||0));
  const el=$('#plist');
  if(!arr.length){el.innerHTML=`<div class="empty">${PAT.size?'ما في نتائج.':'لسا ما في مرضى.<br>اضغط «+ مريض / مراجعة» وسجّل أول مريض.'}</div>`;return}

/* ================= image compression ================= */
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const M=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',0.72)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u})}

/* ================= duplicate detection ================= */
function findDups({name,phone,nid},excludeId){
  const n=norm(name),pk=phoneKey(phone),nd=digits(nid),out=[];
  if(!n&&pk.length<7&&nd.length<5)return out;
  const nt=n.split(' ').filter(Boolean);
  for(const p of PAT.values()){
    if(p.id===excludeId)continue;let score=0,why=[];
    if(nd.length>=5&&digits(p.nid)===nd){score+=10;why.push('نفس رقم الهوية')}
    if(pk.length>=7&&phoneKey(p.phone)===pk){score+=6;why.push('نفس رقم الجوال')}
    const pn=norm(p.name);
    if(n&&pn===n){score+=8;why.push('نفس الاسم')}
    else if(nt.length>=2){const pt=pn.split(' ');if(pt[0]===nt[0]&&pt[pt.length-1]===nt[nt.length-1]){score+=4;why.push('اسم مشابه')}else if(n.length>=4&&pn.startsWith(n)){score+=2;why.push('اسم مشابه')}}
    if(score)out.push({p,score,why});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,4);
}

function viewOps(){
  const t=today();
  const hs=[...new Set(OPS.map(o=>o.hospital).filter(Boolean))];
  const open=OPS.filter(o=>o.status==='open');
  const cnt={up:open.filter(o=>o.date).length,wait:open.filter(o=>!o.date).length,done:OPS.filter(o=>o.status==='done').length,cancel:OPS.filter(o=>o.status==='cancelled').length};
  let arr=OPS.filter(o=>opTab==='up'?o.status==='open'&&o.date:opTab==='wait'?o.status==='open'&&!o.date:opTab==='done'?o.status==='done':o.status==='cancelled');
  if(opHosp!=='all')arr=arr.filter(o=>o.hospital===opHosp);
  let body='';
  if(opTab==='up'){
    arr.sort((a,b)=>a.date.localeCompare(b.date)||String(a.time||'').localeCompare(String(b.time||'')));
    const groups=new Map();for(const o of arr){if(!groups.has(o.date))groups.set(o.date,[]);groups.get(o.date).push(o)}
    for(const [d,os] of groups)body+=`<div class="dhead"><b>${d<t?'⚠ متأخرة — ':''}${rel(d)} <span class="note">(${os.length})</span></b><button class="btn sm" onclick="shareDay('${d}')">مشاركة القائمة</button></div>`+os.map(o=>opCard(o,true)).join('');
  }else{
    if(opTab==='wait')arr.sort((a,b)=>(a.priority==='urgent'?0:1)-(b.priority==='urgent'?0:1)||(a.created||0)-(b.created||0));
    else arr.sort((a,b)=>String(b.doneDate||b.date||'').localeCompare(String(a.doneDate||a.date||''))||(b.updated||0)-(a.updated||0));
    body=arr.map(o=>opCard(o,true)).join('');
  }
  $('#view').innerHTML=`<header class="top"><h1>قائمة العمليات</h1></header>
  ${segHTML('optab',[['up',`القادمة (${cnt.up})`],['wait',`الانتظار (${cnt.wait})`],['done',`المنجزة (${cnt.done})`],['cancel',`الملغاة (${cnt.cancel})`]],opTab)}
  ${hs.length>1?`<div class="chips"><button data-h="all" class="${opHosp==='all'?'on':''}">كل المستشفيات</button>${hs.map(h=>`<button data-h="${esc(h)}" class="${opHosp===h?'on':''}">${esc(h)}</button>`).join('')}</div>`:''}
  ${body||`<div class="empty">${opTab==='up'?'ما في عمليات مجدولة.':opTab==='wait'?'قائمة الانتظار فاضية.':opTab==='done'?'لسا ما في عمليات منجزة.':'ما في عمليات ملغاة.'}</div>`}
  ${opTab==='wait'&&arr.length?'<p class="note">العمليات بدون تاريخ بتظهر هون. حدّد لها تاريخ من «تعديل / تأجيل» بتنتقل للقادمة.</p>':''}`;
  wireSeg($('#view'),(n,v)=>{opTab=v;viewOps()});
  document.querySelectorAll('.chips [data-h]').forEach(b=>b.onclick=()=>{opHosp=b.dataset.h;viewOps()});
}

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function buildBackup(pass){
  const files=[];for(const f of await DB.all('files')){files.push({id:f.id,type:f.blob.type,data:b64(await f.blob.arrayBuffer())})}
  const s=Object.assign({},SET);delete s.pinHash;delete s.pinSalt;delete s.backupPass;
  const plain=JSON.stringify({patients:[...PAT.values()],visits:VIS,surgeries:OPS,settings:s,files});
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pass,salt),enc.encode(plain));
  return JSON.stringify({app:'clinic',v:1,created:new Date().toISOString(),counts:{patients:PAT.size,visits:VIS.length,surgeries:OPS.length,images:files.length},salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function backupNow(){
  if(!SET.backupPass){setBackupPass(true);return}
  toast('جاري تجهيز النسخة…');
  try{
    const txt=await buildBackup(SET.backupPass);const name=`clinic-backup-${today()}.json`;
    const file=new File([txt],name,{type:'application/json'});
    let shared=false;
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'نسخة عيادتي',text:`نسخة احتياطية مشفّرة — ${fd(today())} — ${PAT.size} مريض`});shared=true}catch(e){if(e.name==='AbortError')return}}
    if(!shared){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('تنزّلت النسخة — أرسلها لإيميلك كمرفق')}
    SET.lastBackup=Date.now();SET.changes=0;await saveSet();
    if(file.size>20*1048576)toast('النسخة كبيرة ('+(file.size/1048576).toFixed(0)+' MB) — Gmail بيقبل لحد 25 MB');
    route();
  }catch(e){toast('تعذّر تجهيز النسخة: '+e.message)}
}
function setBackupPass(thenBackup){
  openSheet('كلمة سر النسخ الاحتياطي',`<p class="note" style="margin-top:0">النسخة اللي بتنبعت لإيميلك بتكون <b>مشفّرة</b> بهاي الكلمة، فما حدا بيقدر يقرأ بيانات المرضى بدونها، حتى لو وصل لإيميلك.</p>
  <form id="bf"><label class="f"><span>كلمة السر (6 أحرف أو أكثر)</span><input name="a" type="password" autocomplete="new-password"></label><label class="f"><span>أعدها مرة ثانية</span><input name="b" type="password" autocomplete="new-password"></label></form>
  <div class="banner"><div><b>مهم:</b> احفظها في مكان آمن غير الجوال. بدونها ما بتقدر ترجع النسخة على جوال جديد.</div></div><div class="err" id="berr"></div>`,`<button class="btn p" id="bsave">حفظ</button><button class="btn" data-close>إلغاء</button>`);
  $('#bsave').onclick=async()=>{const f=$('#bf');if(f.a.value.length<6){$('#berr').textContent='لازم 6 أحرف أو أكثر';return}if(f.a.value!==f.b.value){$('#berr').textContent='الكلمتين مش متطابقتين';return}
    SET.backupPass=f.a.value;await saveSet();closeSheet();toast('انحفظت كلمة السر');if(thenBackup)backupNow();else route()};
}
function restoreForm(){
  openSheet('استرجاع نسخة احتياطية',`<p class="note" style="margin-top:0">نزّل ملف النسخة من إيميلك (clinic-backup-…json)، واختاره هون، واكتب كلمة السر.</p>
  <form id="rf"><label class="f"><span>ملف النسخة</span><input type="file" name="file" accept=".json,application/json,text/plain"></label><label class="f"><span>كلمة سر النسخة</span><input name="pass" type="password"></label></form>
  <div class="banner"><div><b>تنبيه:</b> الاسترجاع بيستبدل كل البيانات الموجودة حالياً على هذا الجهاز.</div></div><div class="err" id="rerr"></div>`,`<button class="btn p" id="rgo">استرجاع</button><button class="btn" data-close>إلغاء</button>`);
  $('#rgo').onclick=async()=>{const f=$('#rf'),err=$('#rerr');err.textContent='';const file=f.file.files[0];if(!file){err.textContent='اختار ملف النسخة';return}
    try{
      const j=JSON.parse(await file.text());if(j.app!=='clinic')throw new Error('bad');
      let plain;try{plain=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},await keyFrom(f.pass.value,unb64(j.salt)),unb64(j.data)))}catch(e){err.textContent='كلمة السر غلط';return}
      const d=JSON.parse(plain);
      if(!confirm(`النسخة من ${new Date(j.created).toLocaleString('ar')}\nفيها ${d.patients.length} مريض و ${d.surgeries.length} عملية.\n\nاستبدال البيانات الحالية؟`))return;
      for(const s of ['patients','visits','surgeries','files'])await DB.clear(s);
      for(const p of d.patients)await DB.put('patients',p);for(const v of d.visits)await DB.put('visits',v);for(const o of d.surgeries)await DB.put('surgeries',o);
      for(const fl of d.files||[])await DB.put('files',{id:fl.id,blob:new Blob([unb64(fl.data)],{type:fl.type||'image/jpeg'}),created:Date.now()});
      const keep={pinHash:SET.pinHash,pinSalt:SET.pinSalt,backupPass:SET.backupPass||f.pass.value};
      SET=Object.assign({},DEF_SET,d.settings||{},keep,{lastBackup:Date.now(),changes:0,syncUrl:SET.syncUrl||null,lastSync:0,pushedAt:0,tomb:[]});await saveSet();syncSoon(500);
      await loadAll();closeSheet();toast('رجعت البيانات ✓');go('#patients');
    }catch(e){err.textContent='الملف مش نسخة صحيحة من «عيادتي»'}};
}
function csvCell(s){s=String(s??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function exportCSV(){
  if(!confirm('ملفات Excel بتكون غير مشفّرة وفيها بيانات المرضى.\nاستخدمها للطباعة أو العمل على الكمبيوتر، ولا ترسلها لحدا. متابعة؟'))return;
  const side={r:'يمين',l:'يسار',b:'ثنائي'};
  const r1=[['رقم الملف','الاسم','العمر','الجنس','الجوال','الهوية','تاريخ الزيارة','نوع الزيارة','المكان','الشكوى','الفحص','التشخيص','العلاج','الفحوصات','ملاحظات']];
  for(const v of [...VIS].sort((a,b)=>a.date.localeCompare(b.date))){const p=PAT.get(v.patientId)||{};r1.push([p.no,p.name,ageNow(p),p.sex==='m'?'ذكر':p.sex==='f'?'أنثى':'',p.phone,p.nid,v.date,v.type==='first'?'أول زيارة':'مراجعة',v.place,v.complaint,v.exam,v.diagnosis,v.treatment,(v.inv||[]).map(i=>`${i.kind||INV[i.cat]?.n}${i.right?' R: '+i.right:''}${i.left?' L: '+i.left:''}${i.result?' — '+i.result:''}`).join(' | '),v.notes])}
  const r2=[['الاسم','الجوال','العملية','الجهة','التشخيص','المستشفى','التاريخ','الوقت','الأولوية','الحالة','تاريخ الإنجاز','ملاحظات']];
  for(const o of OPS){const p=PAT.get(o.patientId)||{};r2.push([p.name,p.phone,o.procedure,side[o.side]||'',o.diagnosis,o.hospital,o.date,o.time,o.priority==='urgent'?'مستعجل':'عادي',{open:o.date?'مجدولة':'انتظار',done:'تمت',cancelled:'ملغاة'}[o.status],o.doneDate,[o.notes,o.doneNotes].filter(Boolean).join(' — ')])}
  const mk=(rows,n)=>new File(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],n,{type:'text/csv'});
  const fs=[mk(r1,`patients-visits-${today()}.csv`),mk(r2,`surgeries-${today()}.csv`)];
  if(navigator.canShare&&navigator.canShare({files:fs})){try{await navigator.share({files:fs});return}catch(e){if(e.name==='AbortError')return}}
  for(const f of fs){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
}

/* ================= PIN lock ================= */
async function hashPin(pin,salt){const h=await crypto.subtle.digest('SHA-256',enc.encode(salt+':'+pin));return b64(h)}
let pinBuf='',pinMode='unlock',pinFirst='',hiddenAt=0;
function showLock(mode){pinMode=mode;pinBuf='';pinFirst='';$('#lockT').textContent=mode==='set'?'اختر رمز دخول من 4 أرقام':'أدخل رمز الدخول';$('#lerr').textContent='';$('#forgot').hidden=mode!=='unlock';drawDots();$('#lock').classList.add('open')}
function drawDots(){$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('');
$('#pad').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawDots();return}
  if(pinBuf.length>=4)return;pinBuf+=k;drawDots();if(pinBuf.length<4)return;
  if(pinMode==='unlock'){if(await hashPin(pinBuf,SET.pinSalt)===SET.pinHash){$('#lock').classList.remove('open')}else{$('#lerr').textContent='الرمز غلط';pinBuf='';drawDots()}}
  else if(pinMode==='set'){if(!pinFirst){pinFirst=pinBuf;pinBuf='';$('#lockT').textContent='أعد الرمز للتأكيد';drawDots()}else if(pinFirst===pinBuf){SET.pinSalt=b64(crypto.getRandomValues(new Uint8Array(12)));SET.pinHash=await hashPin(pinBuf,SET.pinSalt);await saveSet();$('#lock').classList.remove('open');toast('تفعّل رمز الدخول');route()}else{$('#lerr').textContent='الرمزين مش متطابقين، جرّب من جديد';pinFirst='';pinBuf='';$('#lockT').textContent='اختر رمز دخول من 4 أرقام';drawDots()}}
};
$('#forgot').onclick=async()=>{const a=prompt('إذا نسيت الرمز، الحل الوحيد مسح كل البيانات على هذا الجهاز ثم استرجاع آخر نسخة من إيميلك.\n\nللمسح اكتب: مسح');if(a&&a.trim()==='مسح'){for(const s of ['patients','visits','surgeries','files'])await DB.clear(s);SET=Object.assign({},DEF_SET);await saveSet();await loadAll();$('#lock').classList.remove('open');go('#settings');toast('انمسحت البيانات — استرجع نسختك')}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hiddenAt=Date.now();else if(SET.pinHash&&hiddenAt&&Date.now()-hiddenAt>(SET.lockMins||5)*60000&&!$('#lock').classList.contains('open'))showLock('unlock')});

/* ================= settings ================= */
async function viewSettings(){
  let usage='';try{const e=await navigator.storage.estimate();usage=(e.usage/1048576).toFixed(1)+' MB'}catch(e){}
  const nf=(await DB.all('files')).length;
  const days=SET.lastBackup?Math.floor((Date.now()-SET.lastBackup)/864e5):null;
  $('#view').innerHTML=`<header class="top"><h1>النسخ الاحتياطي والإعدادات</h1></header>
  <div class="card"><b>النسخ الاحتياطي على الإيميل</b>
   <p class="note" style="margin:6px 0 10px">${SET.lastBackup?`آخر نسخة: ${days===0?'اليوم':'قبل '+days+' يوم'} · تعديلات بعدها: ${SET.changes||0}`:'لسا ما أخذت نسخة.'}</p>
   <div class="acts" style="margin-top:0"><button class="btn p" onclick="backupNow()">📧 إرسال نسخة لإيميلي</button><button class="btn" onclick="restoreForm()">استرجاع نسخة</button></div>
   <p class="note" style="margin:10px 0 0">بتفتح قائمة المشاركة ← اختار Gmail ← أرسلها لنفسك. النسخة مشفّرة وفيها كل شي: المرضى والزيارات والفحوصات والصور والعمليات.</p>
   <div class="acts"><button class="btn sm" onclick="setBackupPass(false)">${SET.backupPass?'تغيير كلمة سر النسخ':'تعيين كلمة سر النسخ'}</button></div></div>
  <h2>المزامنة مع Google والكالندر</h2>
  <div class="card">${SET.syncUrl?`<div>🔄 المزامنة شغالة مع ملف Google Sheet الخاص فيك، ومواعيد العمليات والمراجعات بتنزل على Google Calendar.</div>
   <p class="note" style="margin:6px 0 0">${SYNC.busy?'جاري المزامنة…':SET.syncedAt?'آخر مزامنة: '+new Date(SET.syncedAt).toLocaleString('ar'):'لسا ما صارت مزامنة'}${SYNC.err?' · <span style="color:#b00020">'+esc(SYNC.err)+'</span>':''}</p>
   <div class="acts"><button class="btn sm p" onclick="syncNow(true)">مزامنة الآن</button><button class="btn sm" onclick="syncSetup()">تغيير الرابط</button><button class="btn sm d" onclick="syncOff()">إيقاف</button></div>`
   :`<div>اربط التطبيق بملف Google Sheet خاص فيك عشان تنحفظ نسخة أونلاين، وتنزل مواعيد العمليات والمراجعات على الكالندر تلقائي. الصور بتضل على الجوال.</div><div class="acts"><button class="btn sm p" onclick="syncSetup()">ربط المزامنة</button></div>`}</div>
  <h2>الأمان</h2>
  <div class="card">${SET.pinHash?`<div>🔒 رمز الدخول مفعّل — بيقفل بعد ${SET.lockMins||5} دقائق بعيد عن التطبيق.</div><div class="acts"><button class="btn sm" onclick="showLock('set')">تغيير الرمز</button><button class="btn sm d" id="pinOff">إيقاف الرمز</button></div>`:`<div>رمز دخول من 4 أرقام عشان ما حدا يفتح ملفات المرضى من جوالك.</div><div class="acts"><button class="btn sm p" onclick="showLock('set')">تفعيل رمز الدخول</button></div>`}</div>
  <h2>المستشفيات والعيادات</h2>
  <div class="card"><div id="hl">${(SET.hospitals||[]).map((h,i)=>`<div class="hl"><span>${esc(h)}</span><button class="btn sm d" data-hd="${i}">حذف</button></div>`).join('')||'<p class="note">ما في أماكن.</p>'}</div>
   <div class="acts"><button class="btn sm" id="hadd">+ إضافة مكان</button></div></div>
  <h2>تصدير</h2>
  <div class="card"><div>ملفات Excel (CSV) للمرضى والزيارات والعمليات — للطباعة أو الكمبيوتر.</div><div class="acts"><button class="btn sm" onclick="exportCSV()">تصدير Excel</button></div></div>
  <h2>معلومات</h2>
  <div class="card note">${PAT.size} مريض · ${VIS.length} زيارة · ${OPS.length} عملية · ${nf} صورة${usage?' · المساحة المستخدمة '+usage:''}<br>${SET.syncUrl?'البيانات محفوظة على هذا الجهاز، ونسخة منها (بدون الصور) في ملف Google Sheet الخاص فيك.':'البيانات محفوظة على هذا الجهاز فقط، وما بتنرفع على أي سيرفر.'}</div>`;
  if(SET.pinHash)armDelete($('#pinOff'),async()=>{SET.pinHash=null;SET.pinSalt=null;await saveSet();toast('انطفى الرمز');route()});
  document.querySelectorAll('[data-hd]').forEach(b=>b.onclick=async()=>{SET.hospitals.splice(+b.dataset.hd,1);await saveSet();route()});
  $('#hadd').onclick=async()=>{const n=(prompt('اسم المستشفى أو العيادة:')||'').trim();if(n&&!SET.hospitals.includes(n)){SET.hospitals.push(n);await saveSet();route()}};
}

/* ================= start ================= */
(async function(){
  try{await DB.open();await loadAll()}catch(e){$('#view').innerHTML='<div class="empty">تعذّر فتح قاعدة البيانات على هذا المتصفح.</div>';return}
  if(SET.pinHash)showLock('unlock');
  route();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  syncSoon(1500);setInterval(()=>syncSoon(0),5*60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(500)});
  window.addEventListener('online',()=>syncSoon(500));
})();
</script>
